<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI buddy</title>
<style>
  :root { --bg: #f4f6fb; --panel: #ffffff; --ink: #141a2b; --muted: #61697f; --me: #4f46e5; --line: #e1e5ef; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1020; --panel: #161a2e; --ink: #e8ebf7; --muted: #9aa3bd; --me: #818cf8; --line: #262c47; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px; }
  .face { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; background: linear-gradient(135deg, #6366f1, #ec4899); }
  h1 { font-size: 1.15rem; margin: 0; } .tag { color: var(--muted); font-size: 0.85rem; margin: 0; }
  header button { margin-left: auto; }
  #log { overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ai { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; align-self: flex-start; }
  .me { background: var(--me); color: #fff; border-bottom-right-radius: 6px; align-self: flex-end; }
  .hint { color: var(--muted); text-align: center; margin: auto; padding: 24px; max-width: 420px; }
  form { display: flex; gap: 8px; padding: 12px 16px 18px; background: linear-gradient(transparent, var(--bg) 30%); }
  input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); color: inherit; border-radius: 999px; padding: 12px 16px; font: inherit; }
  button { border: 0; border-radius: 999px; padding: 10px 18px; background: var(--me); color: #fff; font: 600 0.95rem system-ui, sans-serif; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; font-weight: 500; }
  button:disabled { opacity: 0.6; cursor: default; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--me) 45%, transparent); outline-offset: 2px; }
  .typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="face" aria-hidden="true">🤖</div>
    <div><h1>AI buddy</h1><p class="tag">Friendly, curious and a little bit funny.</p></div>
    <button class="ghost" id="clear" type="button" hidden>New chat</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="ask"><input id="q" autocomplete="off" maxlength="2000" placeholder="Say something…" aria-label="Your message"><button type="submit">Send</button></form>
</div>
<script src="/_openvibe/sdk.js"></script>
<script>
  const log = document.getElementById('log'), form = document.getElementById('ask'), input = document.getElementById('q'), clear = document.getElementById('clear');
  let history = [];
  function bubble(role, text, cls) { const d = document.createElement('div'); d.className = 'msg ' + (role === 'user' ? 'me' : 'ai') + (cls ? ' ' + cls : ''); d.textContent = text; log.append(d); log.scrollTop = log.scrollHeight; return d; }
  function render() {
    log.replaceChildren();
    if (!OV.user) {
      const h = document.createElement('div'); h.className = 'hint';
      h.append('Sign in to chat. Your conversation is kept just for you. ');
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Sign in with OpenVibe'; b.onclick = () => OV.signIn();
      h.append(document.createElement('br'), document.createElement('br'), b); log.append(h); clear.hidden = true; return;
    }
    if (!history.length) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Hi ' + OV.user.display_name + '! Ask me anything.'; log.append(h); }
    history.forEach((m) => bubble(m.role, m.content));
    clear.hidden = !history.length;
  }
  async function loadHistory() { history = OV.user ? (await OV.kv.get('history').catch(() => null)) || [] : []; render(); }
  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = input.value.trim(); if (!text) return;
    if (!OV.user) return OV.signIn();
    input.value = ''; form.querySelector('button').disabled = true;
    if (!history.length) log.replaceChildren();
    history.push({ role: 'user', content: text }); bubble('user', text);
    const wait = bubble('ai', 'thinking…', 'typing');
    try {
      const answer = await OV.ai.ask({ messages: history.slice(-20) });
      history.push({ role: 'assistant', content: answer }); wait.classList.remove('typing'); wait.textContent = answer;
      await OV.kv.set('history', history.slice(-40));
    } catch (err) {
      history.pop(); wait.classList.remove('typing');
      wait.textContent = err.code === 'quota' ? 'I am out of answers for today. Come back tomorrow!' : 'Hmm, I could not answer: ' + err.message;
    } finally { form.querySelector('button').disabled = false; clear.hidden = !history.length; input.focus(); }
  };
  clear.onclick = async () => { history = []; await OV.kv.remove('history').catch(() => {}); render(); };
  OV.on('user', loadHistory);
  OV.ready.then(loadHistory);
</script>
</body>
</html>
