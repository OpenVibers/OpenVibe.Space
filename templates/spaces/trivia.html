<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia</title>
<style>
  :root { --bg: #0f1020; --panel: #181a30; --ink: #f4f4fb; --muted: #a3a6c4; --line: #2a2d4a; --accent: #f59e0b; --right: #22c55e; --wrong: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 500px at 50% -200px, #2a2150, var(--bg)); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 56px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.01em; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .score { flex: none; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px 14px; }
  .score b { display: block; font-size: 1.5rem; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .score span { font-size: .8rem; color: var(--muted); }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: q; }
  li { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; counter-increment: q; transition: border-color .2s; }
  li.right { border-color: color-mix(in srgb, var(--right) 60%, var(--line)); }
  .q { margin: 0 0 10px; font-weight: 650; }
  .q::before { content: counter(q) ". "; color: var(--accent); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; border: 1px solid var(--line); background: #0d0e1c; color: inherit; border-radius: 12px; padding: 10px 12px; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 3px solid #818cf8; outline-offset: 2px; }
  button { border: 0; border-radius: 12px; padding: 10px 16px; font: 650 1rem/1.2 inherit; background: var(--accent); color: #1a1205; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .result { margin: 8px 0 0; font-size: .92rem; color: var(--muted); }
  .result:empty { display: none; }
  .result.right { color: var(--right); } .result.wrong { color: var(--wrong); }
  footer { margin-top: 22px; color: var(--muted); font-size: .88rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Trivia</h1><p class="sub">Five questions. The answers are kept on the server, so no peeking.</p></div>
    <div class="score" aria-live="polite"><b id="score">0/5</b><span>right</span></div>
  </header>
  <ol id="questions"></ol>
  <footer>Made on OpenVibe.Space. Edit the questions in index.html and the answers in functions/check.js.</footer>
</main>
<script src="/_openvibe/sdk.js"></script>
<script>
  const QUESTIONS = [
    { id: 'sun', text: 'Which planet is closest to the Sun?' },
    { id: 'moon', text: 'In what year did people first walk on the Moon?' },
    { id: 'ocean', text: 'What is the largest ocean on Earth?' },
    { id: 'bones', text: 'How many bones are in an adult human body?' },
    { id: 'hearts', text: 'How many hearts does an octopus have?' },
  ];
  const solved = new Set();
  const list = document.getElementById('questions');
  const score = () => { document.getElementById('score').textContent = solved.size + '/' + QUESTIONS.length; };

  for (const q of QUESTIONS) {
    const li = document.createElement('li');
    const p = document.createElement('p'); p.className = 'q'; p.textContent = q.text;
    const form = document.createElement('form');
    const input = document.createElement('input'); input.placeholder = 'Your answer'; input.autocomplete = 'off'; input.setAttribute('aria-label', q.text);
    const button = document.createElement('button'); button.type = 'submit'; button.textContent = 'Check';
    const result = document.createElement('p'); result.className = 'result'; result.setAttribute('aria-live', 'polite');
    form.append(input, button);
    li.append(p, form, result);
    list.append(li);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!input.value.trim()) return input.focus();
      button.disabled = true;
      try {
        const r = await OV.fn('check', { id: q.id, answer: input.value });
        if (r.right) {
          solved.add(q.id); score();
          li.classList.add('right'); input.disabled = true;
          result.className = 'result right';
          result.textContent = 'Right! ' + (r.solved === 1 ? 'You are the first to get it.' : r.solved + ' right answers so far.');
          return;
        }
        result.className = 'result wrong';
        result.textContent = 'Not quite. Try again.';
        button.disabled = false; input.select();
      } catch (err) {
        result.className = 'result wrong';
        result.textContent = 'Could not check: ' + err.message;
        button.disabled = false;
      }
    });
  }
  score();
</script>
</body>
</html>
