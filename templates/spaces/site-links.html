<style>
  /* Change the colours here: the page's gradient runs from --from to --to. */
  :root { --from: #ffe1ec; --to: #e4e8ff; --card: rgba(255, 255, 255, .72); --ink: #1d1a2b; --muted: #635d78; --line: rgba(29, 26, 43, .1); --accent: #6d4aff; }
  @media (prefers-color-scheme: dark) { :root { --from: #2a1230; --to: #10183a; --card: rgba(255, 255, 255, .07); --ink: #f3f0ff; --muted: #b3acd0; --line: rgba(255, 255, 255, .12); --accent: #a996ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, var(--from), var(--to)) fixed; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; justify-items: center; padding: 48px 16px 32px; }
  main { width: min(480px, 100%); display: grid; gap: 22px; text-align: center; }
  .face { width: 104px; height: 104px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font: 800 2.2rem system-ui, sans-serif; color: #fff; background: conic-gradient(from 200deg, #ff7aa8, #8b6cff, #4cc9ff, #ff7aa8); box-shadow: 0 0 0 5px var(--card), 0 18px 40px -18px rgba(60, 30, 120, .6); }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; }
  .bio { margin: 6px 0 0; color: var(--muted); }
  .links { display: grid; gap: 12px; }
  .links a { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; font-weight: 650; backdrop-filter: blur(10px); text-align: left; transition: transform .15s ease; }
  .links a:hover { transform: translateY(-2px); }
  .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .links svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .links small { display: block; font-weight: 500; color: var(--muted); }
  .links .new { margin-left: auto; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .social { display: flex; justify-content: center; gap: 10px; }
  .social a { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--ink); }
  .social svg { width: 20px; height: 20px; }
  footer { color: var(--muted); font-size: .82rem; }
  @media (prefers-reduced-motion: reduce) { .links a { transition: none; } }
</style>
