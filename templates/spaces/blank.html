<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My space</title>
<style>
  :root { --bg: #f7f7fb; --ink: #16161d; --muted: #6b6b7b; --accent: #7c3aed; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101016; --ink: #ececf3; --muted: #a0a0b4; --accent: #a78bfa; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { border: 0; border-radius: 999px; padding: 10px 18px; background: var(--accent); color: #fff; font: 600 1rem system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Hello!</h1>
  <p id="hi">This is my new space on OpenVibe.</p>
  <button id="who" type="button">Sign in with OpenVibe</button>
</main>
<script src="/_openvibe/sdk.js"></script>
<script>
  const hi = document.getElementById('hi'), who = document.getElementById('who');
  function show() {
    hi.textContent = OV.user ? 'Welcome, ' + OV.user.display_name + '!' : 'This is my new space on OpenVibe.';
    who.textContent = OV.user ? 'Sign out' : 'Sign in with OpenVibe';
  }
  who.onclick = () => (OV.user ? OV.signOut() : OV.signIn());
  OV.on('user', show);
  OV.ready.then(show);
</script>
</body>
</html>
