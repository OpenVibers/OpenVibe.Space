## ═══════════════════════════════════════════════════════════════
## openvibe.space — Nginx Configuration (REFERENCE)
##
## This file is what is deployed to /etc/nginx/sites-available/openvibe.space.conf
## — keep them in sync, and reload nginx after changing it.
##
## The Node app (port 4940, systemd unit openvibe-space) renders the site: the home page, sign-in
## (/auth/*), the discovery files (/robots.txt, /llms.txt, /sitemap.xml) and health/readiness.
## The forum is OpenVibe.Community's again (owner decision, 2026-10-08): Node answers every forum URL
## — /s and /s/*, /api/v1/spaces|posts|space-groups|relay — with a permanent redirect to the same path
## there, so nginx just proxies. nginx terminates TLS, redirects www → apex, rate-limits the auth and
## API paths, and compresses text.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovspace_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovspace_auth:10m rate=10r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.space www.openvibe.space;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.space$request_uri; }
}

# ── www → apex ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.space;

    ssl_certificate     /etc/letsencrypt/live/openvibe.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.space$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.space;
    include snippets/security-txt.conf;   # /.well-known/security.txt (the host's file)

    ssl_certificate     /etc/letsencrypt/live/openvibe.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.space.access.log;
    error_log  /var/log/nginx/openvibe.space.error.log;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compress text for the hop to Cloudflare as well (the global config only compresses
    # text/html and never proxied responses).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml text/xml application/rss+xml;

    # ── OAuth session endpoints (strict rate limit) ─────────
    # The session probe: the shared navbar asks it on every page view, so it cannot share the sign-in
    # budget below (10 a minute): a visitor reading quickly would be answered 503 and look signed out.
    location = /auth/me {
        limit_req zone=ovspace_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4940;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        limit_req zone=ovspace_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4940;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API (moderate rate limit) ───────────────────────────
    # Space serves only /api/health and /api/ready here; the forum APIs are permanent redirects to
    # OpenVibe.Community, and a redirected request should reach it with its method and body intact.
    location /api/ {
        limit_req zone=ovspace_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4940;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets: Node marks hashed ?v= URLs immutable; let browsers keep them ──
    location ~ ^/(?!api/|auth/).*\.(?:css|js|svg|png|ico|webmanifest|woff2?)$ {
        proxy_pass http://127.0.0.1:4940;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4940/metrics). Node also
    #    refuses any request carrying X-Forwarded-For, which every location above sets. ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── Everything else (server-rendered pages) ─────────────
    location / {
        proxy_pass http://127.0.0.1:4940;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
