# Reference wildcard tenant vhost for OpenVibe.Space. Install only with a wildcard certificate
# for openvibe.website and the matching DNS; custom-domain TLS vhosts are generated separately.
limit_req_zone $binary_remote_addr zone=ovspace_sites:20m rate=50r/s;
server {
    listen 80;
    listen [::]:80;
    server_name *.openvibe.website;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.openvibe.website;
    ssl_certificate /etc/letsencrypt/live/openvibe.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        limit_except GET HEAD { deny all; }
        limit_req zone=ovspace_sites burst=200 nodelay;
        proxy_pass http://127.0.0.1:4940;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
    }
}
