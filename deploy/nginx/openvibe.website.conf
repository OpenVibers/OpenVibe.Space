# Reference wildcard tenant vhost for OpenVibe.Space. Install only with a wildcard certificate
# for openvibe.website and the matching DNS; custom-domain TLS vhosts are generated separately.
limit_req_zone $binary_remote_addr zone=ovspace_sites:20m rate=50r/s;
server {
    listen 80;
    listen [::]:80;
    server_name *.openvibe.website;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.openvibe.website;
    include snippets/security-txt.conf;
    ssl_certificate /etc/letsencrypt/live/openvibe.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # A space's functions (/api/<name>, server/spaces/functions.js) also take POST, a small body and the page's
    # Bearer token (the space SDK's sign-in); cookies never pass, as everywhere on a tenant host.
    location ~ "^/api/[a-z0-9][a-z0-9-]{0,39}/?$" {
        limit_except GET HEAD POST { deny all; }
        client_max_body_size 64k;
        limit_req zone=ovspace_sites burst=200 nodelay;
        proxy_pass http://127.0.0.1:4940;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
    }
    location / {
        limit_except GET HEAD { deny all; }
        limit_req zone=ovspace_sites burst=200 nodelay;
        proxy_pass http://127.0.0.1:4940;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
    }
}

# openvibe.website itself (and www): OpenVibe.Website's front door, answered by Space's server/website.js (it left
# OpenVibe.Network's parked-domains.conf on 2026-10-31). The same rule as a tenant host, both ways: no cookie in, no
# cookie out, GET and HEAD only. Tenants live under this domain and, until its Public Suffix List entry, a tenant's
# script could set a cookie for the whole of it.
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.website www.openvibe.website;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.website$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.website www.openvibe.website;
    include snippets/security-txt.conf;
    ssl_certificate /etc/letsencrypt/live/openvibe.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.website/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        limit_except GET HEAD { deny all; }
        limit_req zone=ovspace_sites burst=200 nodelay;
        proxy_pass http://127.0.0.1:4940;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 60s;
    }
}
